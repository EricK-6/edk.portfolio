<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <!-- root-absolute on purpose: a 404 is served at whatever path was missed,
         so a relative icon would resolve against a directory that isn't there -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>404 - Eric Kim_</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        color: #d6d3d1;
        font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 14px;
        line-height: 1.8;
        padding: 24px;
      }
      .term { max-width: 560px; width: 100%; }
      .user { color: #059669; }
      .dim { color: #57534e; }
      .path { color: #a8a29e; }
      .err { color: #fafaf9; font-weight: 600; }
      a { color: #059669; text-decoration: underline; }
      a:hover { color: #34d399; }
      .cursor {
        display: inline-block;
        color: #059669;
        animation: blink 1.1s step-end infinite;
      }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
    </style>
  </head>
  <body>
    <div class="term">
      <p><span class="user">visitor@erickk.cloud</span><span class="dim">:</span><span class="path">~</span><span class="dim">$</span> cd <span id="missing">/missing</span></p>
      <p><span class="err">cd:</span> no such file or directory <span class="dim">(404)</span></p>
      <p>&nbsp;</p>
      <p><span class="user">visitor@erickk.cloud</span><span class="dim">:</span><span class="path">~</span><span class="dim">$</span> <a href="/">cd ~</a><span class="cursor">_</span></p>
    </div>
    <script>
      document.getElementById('missing').textContent = location.pathname
    </script>
  </body>
</html>
