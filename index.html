<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- the cloud mark in its own ink, with the white paper lifted out to
         alpha: as supplied it was a non-square opaque PNG, which a tab strip
         would have shown as a white tile -->
    <!-- relative, like every other asset reference on the site: `base` is './'
         so the bundle survives a subpath deploy, and a root-absolute icon
         path would have been the one thing that didn't -->
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

    <title>Eric Kim</title>
    <meta
      name="description"
      content="Dohyun (Eric) Kim - Computer Systems Engineering student at the University of Auckland. Embedded systems, software integration, and cloud. Open to internship opportunities."
    />
    <meta name="author" content="Dohyun (Eric) Kim" />
    <link rel="canonical" href="https://erickk.cloud/" />

    <!-- Open Graph (LinkedIn, Twitter, Slack previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Eric Kim" />
    <meta
      property="og:description"
      content="Computer Systems Engineering student at the University of Auckland. Embedded systems, software integration, and cloud. Open to internship opportunities."
    />
    <meta property="og:image" content="https://erickk.cloud/og-image.png?v=5" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://erickk.cloud/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://erickk.cloud/og-image.png?v=5" />

    <!-- Structured data for search engines -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Dohyun Kim",
        "alternateName": "Eric Kim",
        "url": "https://erickk.cloud/",
        "image": "https://erickk.cloud/me.jpg",
        "jobTitle": "Computer Systems Engineering Student",
        "affiliation": {
          "@type": "CollegeOrUniversity",
          "name": "University of Auckland"
        },
        "knowsAbout": ["Embedded Systems", "FPGA", "Cloud Computing", "Software Engineering"],
        "sameAs": [
          "https://github.com/EricK-6",
          "https://www.linkedin.com/in/erick06/"
        ]
      }
    </script>

    <!-- Fonts are self-hosted (Fontsource, imported in src/main.jsx) so the
         page needs no third-party origins and first paint isn't blocked on
         a remote stylesheet. -->
    <script type="module" crossorigin src="./assets/index-C4BY2Dxr.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-Dgt4GP1i.css">
  </head>
  <!-- the page colour up front, so the first paint before the stylesheet
       arrives is the paper rather than a white flash -->
  <body style="background-color: #fbfaf9">
    <!-- A 7,600px document behind a fixed header earns a skip link. It is the
         first thing in the tab order and invisible until focused. -->
    <a
      href="#main"
      style="position:absolute;left:-9999px;top:0;z-index:100;padding:10px 16px;background:#fff;color:#115e59;border-radius:0 0 8px 0;font:500 14px/1 system-ui,sans-serif"
      onfocus="this.style.left='0'"
      onblur="this.style.left='-9999px'"
    >Skip to content</a>
    <div id="root"></div>

    <!-- GoatCounter (privacy-friendly analytics); it skips localhost by
         itself. The hash is deliberately NOT counted any more. It used to be:
         the site was a hash-routed SPA where '#/about' really was another
         page, so each hashchange was a pageview. The site is now one scrolling
         document and '#about' is an anchor inside it, so counting those turned
         a single visitor who clicked through the contents index into nine
         pageviews. One page, one count. -->
    <script data-goatcounter="https://erickk.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
  </body>
</html>
